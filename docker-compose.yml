services:
  postgres:
    image: postgres:16-alpine
    container_name: snippet-pg
    environment:
      # 口令不写死在版本库里：docker compose 会自动加载同目录 .env，
      # 因此这里直接引用应用同一套变量；未设置时 compose 会直接报错退出。
      POSTGRES_USER: ${DB_USERNAME:-root}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD（不要提交到仓库）}
      POSTGRES_DB: ${DB_NAME:-html5_examples}
    ports:
      # 只绑本机回环：避免这台开发库被同网段或公网访问。
      # 若确需外部连接，再显式改成 '<你的网卡IP>:5433:5432'，别用 '5433:5432'（默认绑 0.0.0.0）。
      - '127.0.0.1:5433:5432'
    volumes:
      - snippet_pgdata:/var/lib/postgresql/data
    restart: unless-stopped

volumes:
  snippet_pgdata:
